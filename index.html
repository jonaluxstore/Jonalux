<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>JONALUX Furniture Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style id="css">/* Layout: sticky header + language toggle, one view at a time (hash routed). Deep purple hero, beige/white body, gold used only for rules, numbers and prices. */
:root{
  --purple:#2C2344; --purple-deep:#1C1530; --lilac:#8A7BA8;
  --gold:#C6A56B; --gold-text:#8A6A2F; --beige:#EDE5D8; --white:#FFFFFF;
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#EDE5D8; --fg:#2C2344; --muted:#6A6179;
  --line:rgba(44,35,68,.16); --accent:#2C2344; --on-accent:#FAF7F2; --accent-hover:#41355F;
  --hero-bg:#2C2344; --hero-fg:#F6F1E9; --hero-gold:#D1B27A; --focus:#8A6A2F; --ok:#2F6B4F; --err:#A33A3A;
  --paper:#FFFFFF; --paper-ink:#2C2344; --paper-muted:#6A6179; --paper-line:#DDD3C3; --paper-gold:#8A6A2F;
  --font-display:'Cormorant Garamond','Amiri',Georgia,serif;
  --font-body:'Jost','Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1530; --surface:#261D3E; --surface-2:#2F2549; --fg:#F1EBE0; --muted:#B5ABC8;
    --line:rgba(237,229,216,.18); --accent:#C6A56B; --on-accent:#1C1530; --accent-hover:#D6B97F;
    --gold-text:#D1B27A; --focus:#D1B27A; --ok:#7CC4A0; --err:#E48A8A; --hero-bg:#2C2344; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1530; --surface:#261D3E; --surface-2:#2F2549; --fg:#F1EBE0; --muted:#B5ABC8;
  --line:rgba(237,229,216,.18); --accent:#C6A56B; --on-accent:#1C1530; --accent-hover:#D6B97F;
  --gold-text:#D1B27A; --focus:#D1B27A; --ok:#7CC4A0; --err:#E48A8A; --hero-bg:#2C2344; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
html[lang="ar"]{--font-display:'Amiri','Cormorant Garamond',serif;--font-body:'Tajawal','Jost',system-ui,sans-serif}
html[lang="ar"] body{line-height:1.8}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin-inline:auto}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-text);font-weight:500}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:.9rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1160px;margin-inline:auto;display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.brand img{height:40px;width:auto;display:block}
.brand .logo-light{display:none}
.brand b{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.45rem;letter-spacing:.22em;direction:ltr}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;padding:8px 14px;border-radius:999px;font-size:.95rem;color:var(--muted)}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{background:var(--surface-2);color:var(--fg)}
.lang{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;min-width:64px}
.lang:hover{border-color:var(--gold-text)}
@media (max-width:760px){.nav{order:3;flex-basis:100%}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo-dark{display:none}:root:not([data-theme="light"]) .brand .logo-light{display:block}}
:root[data-theme="dark"] .brand .logo-dark{display:none}:root[data-theme="dark"] .brand .logo-light{display:block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
  padding:12px 26px;border-radius:999px;font-weight:500;cursor:pointer;text-decoration:none;font-size:1rem;transition:background .2s}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg);background:transparent}
.btn[disabled]{opacity:.55;cursor:wait}
.hero .btn{background:var(--hero-gold);border-color:var(--hero-gold);color:#241B3A}
.hero .btn:hover{background:#E0C58F}
.hero .btn.ghost{background:transparent;color:var(--hero-fg);border-color:rgba(246,241,233,.4)}

/* views */
.view{padding-block:48px 72px}
.view[hidden]{display:none!important}
#view-home{padding-top:0}
.page-head{max-width:760px;margin-bottom:40px;display:flex;flex-direction:column;gap:12px}
.page-head h1{font-size:clamp(2.2rem,5vw,3.4rem)}
.page-head p{color:var(--muted);font-size:1.08rem}

/* hero */
.band{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hero{background:var(--hero-bg);color:var(--hero-fg)}
.hero .wrap{display:grid;grid-template-columns:1.3fr .7fr;gap:40px;align-items:center;padding-block:72px}
.hero h1{font-size:clamp(2.8rem,7vw,5.4rem);font-weight:400;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--hero-gold)}
html[lang="ar"] .hero h1{font-size:clamp(2.6rem,6.4vw,4.6rem);line-height:1.3}
.hero .eyebrow{color:var(--hero-gold)}
.hero .lead{margin-top:22px;font-size:1.12rem;max-width:540px;color:rgba(246,241,233,.82)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero .mark{justify-self:center;width:min(100%,280px);opacity:.95}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr;padding-block:48px}.hero .mark{width:120px;justify-self:start;order:-1}}
.strip{margin-top:-1px}
.strip img{display:block;width:100%;height:clamp(150px,26vw,300px);object-fit:cover;object-position:60% 40%;border-radius:0 0 18px 18px}

/* home pillars */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:56px}
.pillar{border-top:1px solid var(--gold-text);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.pillar h3{font-size:1.7rem}
.pillar p{color:var(--muted)}
@media (max-width:760px){.pillars{grid-template-columns:1fr;gap:24px}}
.entries{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:64px}
.entry{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;min-width:0}
.entry:hover{border-color:var(--gold-text)}
.entry h3{font-size:1.55rem}
.entry p{color:var(--muted);font-size:.96rem}
.entry .go{margin-top:auto;padding-top:10px;color:var(--gold-text);font-weight:500}
html[dir="rtl"] .entry .go .arr{display:inline-block;transform:scaleX(-1)}
@media (max-width:860px){.entries{grid-template-columns:1fr}}

/* steps */
.steps-wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;margin-top:72px}
.steps-wrap h2{font-size:clamp(1.9rem,4vw,2.8rem)}
.steps-wrap .sub{color:var(--muted);margin-top:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:18px;padding-bottom:28px;position:relative}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;inset-inline-start:21px;top:44px;bottom:0;width:1px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .n{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold-text);color:var(--gold-text);display:grid;place-items:center;font-family:var(--font-display);font-size:1.35rem;background:var(--bg)}
.steps h4{font-family:var(--font-body);font-weight:500;font-size:1.08rem;margin-top:8px}
.steps p{color:var(--muted);margin-top:4px;font-size:.96rem}
@media (max-width:860px){.steps-wrap{grid-template-columns:1fr;gap:28px}}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:8px}
.panel{background:var(--hero-bg);color:var(--hero-fg);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .eyebrow{color:var(--hero-gold)}
.panel h2{font-size:1.9rem;font-weight:400}
.panel p{color:rgba(246,241,233,.86);font-size:1.05rem}
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:56px}
.value{border-top:1px solid var(--gold-text);padding-top:14px}
.value h3{font-size:1.5rem}
.value p{color:var(--muted);font-size:.95rem;margin-top:6px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:56px}
.fact h3{font-size:1.4rem;margin-bottom:8px}
.fact p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.93rem;background:var(--surface)}
@media (max-width:860px){.about-grid,.facts{grid-template-columns:1fr}.values{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.values{grid-template-columns:1fr}}

/* services */
.menu{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1.1fr 2fr auto;gap:24px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.row h3{font-family:var(--font-body);font-weight:500;font-size:1.1rem}
.row p{color:var(--muted)}
.price{font-family:var(--font-display);font-size:1.7rem;color:var(--gold-text);white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{font-family:var(--font-body);font-size:.8rem;color:var(--muted);margin-inline-start:4px}
.row.total{border-bottom:0}
.row.total h3{color:var(--muted)}
@media (max-width:640px){.row{grid-template-columns:1fr auto;gap:6px 16px}.row p{grid-column:1/-1;order:3}}
.sub-h{font-size:clamp(1.7rem,3.4vw,2.3rem);margin:64px 0 20px}
.pkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pkg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pkg.feat{border-color:var(--gold-text);box-shadow:0 0 0 1px var(--gold-text) inset}
.pkg h3{font-size:1.6rem}
.pkg ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.pkg li::before{content:"–";margin-inline-end:8px;color:var(--gold-text)}
.pkg .price{margin-top:auto;padding-top:8px}
.save{font-size:.85rem;color:var(--ok);font-weight:500}
@media (max-width:860px){.pkgs{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.mini li b{font-weight:500;white-space:nowrap;color:var(--gold-text);font-variant-numeric:tabular-nums}
.terms{padding-inline-start:20px;margin:0;color:var(--muted);display:flex;flex-direction:column;gap:8px}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:48px}}

/* form */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
@media (max-width:980px){.form-grid{grid-template-columns:1fr}}
fieldset{border:0;margin:0 0 44px;padding:0;min-width:0}
legend{padding:0;display:flex;align-items:baseline;gap:12px;margin-bottom:18px;width:100%}
legend .no{font-family:var(--font-display);color:var(--gold-text);font-size:1.5rem}
legend .t{font-family:var(--font-display);font-size:1.75rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fields .full{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.92rem;font-weight:500}
label.f .hint,.hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-width:0}
input:hover,select:hover,textarea:hover{border-color:var(--gold-text)}
textarea{min-height:110px;resize:vertical}
.dims{display:grid;grid-template-columns:repeat(3,1fr) 110px;gap:12px}
@media (max-width:560px){.dims{grid-template-columns:1fr 1fr}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:.94rem}
.opt input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.opt:hover span{border-color:var(--gold-text)}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.cards{display:grid;gap:12px}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.cards.c2{grid-template-columns:repeat(2,1fr)}
@media (max-width:700px){.cards.c3{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.cards.c3,.cards.c2{grid-template-columns:1fr}}
.card{position:relative;display:block;min-width:0}
.card input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.card .in{display:flex;flex-direction:column;gap:4px;height:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;overflow:hidden}
.card:hover .in{border-color:var(--gold-text)}
.card input:checked+.in{border-color:var(--gold-text);box-shadow:0 0 0 2px var(--gold-text)}
.card input:focus-visible+.in{outline:2px solid var(--focus);outline-offset:2px}
.card .in b{font-weight:500}
.card .in small{color:var(--muted);font-size:.84rem;line-height:1.45}
.card .pr{color:var(--gold-text);font-family:var(--font-display);font-size:1.3rem;margin-top:2px}
.card.style .in{padding:0}
.card.style img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.card.style .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.svc{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.svc:hover{border-color:var(--gold-text)}
.svc input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.svc .b{flex:1;min-width:0}.svc .b b{font-weight:500;display:block}.svc .b small{color:var(--muted)}
.svc .p{color:var(--gold-text);font-family:var(--font-display);font-size:1.3rem;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:10px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper input{width:70px;text-align:center}
.err-msg{color:var(--err);font-size:.88rem;display:none}
.invalid .err-msg{display:block}
.invalid>input,.invalid>select,.invalid>.dims input{border-color:var(--err)}
.group-err{color:var(--err);font-size:.88rem;margin-top:8px;display:none}
.group-err.on{display:block}
aside.sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--hero-bg);color:var(--hero-fg);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px}
@media (max-width:980px){aside.sum{position:static}}
aside.sum h3{font-size:1.6rem;font-weight:400}
aside.sum .eyebrow{color:var(--hero-gold)}
.sum ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.sum li{display:flex;justify-content:space-between;gap:12px}
.sum li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.sum .empty{color:rgba(246,241,233,.65)}
.sum .tot{border-top:1px solid rgba(246,241,233,.25);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum .tot b{font-family:var(--font-display);font-weight:500;font-size:2rem;color:var(--hero-gold);font-variant-numeric:tabular-nums}
.sum .note{font-size:.8rem;color:rgba(246,241,233,.7)}
.sum .btn{background:var(--hero-gold);border-color:var(--hero-gold);color:#241B3A;width:100%}
.sum .btn:hover{background:#E0C58F}

/* result */
.result{display:flex;flex-direction:column;gap:28px}
.result .actions{display:flex;flex-wrap:wrap;gap:12px}
.callout{background:var(--surface-2);border-radius:14px;padding:20px 24px;display:flex;flex-direction:column;gap:6px}
.callout b{font-weight:500}
.sheet-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:16px}
.toast{color:var(--muted);font-size:.9rem;min-height:1.4em}

/* paper sheet (also rendered into the PDF; fixed light colours) */
.sheet{width:794px;background:var(--paper);color:var(--paper-ink);font-family:var(--font-body);font-size:14px;line-height:1.55;margin:0 auto}
.sheet .blk{padding:14px 44px;background:var(--paper)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding-top:36px;border-bottom:2px solid var(--paper-ink);padding-bottom:18px}
.sheet .hd img{height:54px}
.sheet .hd .ttl{text-align:end}
.sheet .hd h2{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--paper-ink)}
.sheet .hd small{color:var(--paper-muted);display:block}
.sheet h4{font-family:var(--font-body);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--paper-gold);font-weight:600;margin:0 0 8px}
html[lang="ar"] .sheet h4{letter-spacing:0;font-size:13px}
.sheet .kv{display:grid;grid-template-columns:170px 1fr;gap:6px 16px}
.sheet .kv dt{color:var(--paper-muted)}.sheet .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.sheet table{width:100%;border-collapse:collapse}
.sheet td{padding:6px 0;border-bottom:1px solid var(--paper-line)}
.sheet td:last-child{text-align:end;white-space:nowrap}
.sheet .tt td{font-weight:700;border-bottom:0;font-size:16px}
.sheet .sty{display:flex;gap:16px;align-items:center}
.sheet .sty img{width:150px;border-radius:8px;border:1px solid var(--paper-line)}
.sheet .ft{border-top:2px solid var(--paper-ink);margin-top:6px;color:var(--paper-muted);font-size:12px;padding-bottom:30px}
.sheet .ft ul{margin:6px 0 0;padding-inline-start:18px}
.sheet .note{white-space:pre-wrap;overflow-wrap:anywhere}

/* footer */
footer{border-top:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:32px max(16px,env(safe-area-inset-left,0px)) 40px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:center}
footer .sig{font-family:var(--font-display);font-size:1.35rem;font-style:italic}
html[lang="ar"] footer .sig{font-style:normal}
footer .ct{color:var(--muted);font-size:.95rem;display:flex;gap:6px 20px;flex-wrap:wrap}
footer .ct a{text-decoration:none;border-bottom:1px solid var(--line)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- v2 additions ---- */
.about-photo{margin:0 0 32px}
.about-photo img{display:block;width:100%;max-height:520px;object-fit:cover;object-position:50% 40%;border-radius:16px}
.lbl{display:block;margin-bottom:8px;font-weight:500;font-size:.92rem}
.mini-h{font-size:1.25rem;margin:22px 0 10px}
.req{margin-inline-start:auto;font-size:.78rem;color:var(--gold-text);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.swatches{display:flex;flex-wrap:wrap;gap:14px 12px}
.swp{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;cursor:pointer}
.swp input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.swp .dot{width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,0,0,.22);position:relative;transition:transform .15s}
.swp:hover .dot{transform:scale(1.06)}
.swp input:checked+.dot{outline:2px solid var(--gold-text);outline-offset:3px}
.swp input:focus-visible+.dot{outline:2px solid var(--focus);outline-offset:3px}
.swp .dot::after{content:"✓";position:absolute;inset-block-end:-4px;inset-inline-end:-4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:20px;text-align:center;opacity:0}
.swp input:checked+.dot::after{opacity:1}
.swp small{font-size:.76rem;text-align:center;color:var(--muted);line-height:1.25}
.readout{margin-top:12px;min-height:1.6em;font-size:.95rem}
.readout b{font-weight:500}
.ph-tones{display:flex;aspect-ratio:4/3;width:100%}
.ph-tones i{flex:1}
.ph-tones i:first-child{flex:2}
.send-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.send-grid{grid-template-columns:1fr}}
.send-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.send-box h3{font-size:1.3rem}
.send-box p{color:var(--muted);font-size:.9rem}
.send-box .btn{width:100%;padding:10px 16px}
.send-box.main{background:var(--hero-bg);color:var(--hero-fg);border-color:transparent}
.send-box.main p{color:rgba(246,241,233,.8)}
.send-box.main .btn{background:var(--hero-gold);border-color:var(--hero-gold);color:#241B3A}
.send-box.main .btn:hover{background:#E0C58F}
.sheet[lang="ar"]{--font-body:'Tajawal','Jost',sans-serif;--font-display:'Amiri',serif}
.sheet[lang="en"]{--font-body:'Jost','Tajawal',sans-serif;--font-display:'Cormorant Garamond','Amiri',serif;}
.sheet[lang="ar"] h4{letter-spacing:0;font-size:13px}
.sheet .tones{display:flex;height:70px;width:150px;border-radius:8px;overflow:hidden;border:1px solid var(--paper-line)}
.sheet .tones i{flex:1}

/* products */
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.prod-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.prod-grid{grid-template-columns:1fr}}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.prod .main-img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--surface-2)}
.prod .thumbs{display:flex;gap:6px;padding:8px 14px 0}
.prod .thumbs button{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:none}
.prod .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.prod .tx{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h3{font-size:1.5rem}
.prod .meta{color:var(--muted);font-size:.9rem}
.prod .desc{color:var(--muted);font-size:.95rem}
.prod .price{font-size:1.6rem;margin-top:auto;padding-top:6px}
.badge{align-self:flex-start;font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.badge.sold{color:var(--err);border-color:var(--err)}
.badge.available{color:var(--ok);border-color:var(--ok)}
.empty-note{padding:40px 0;color:var(--muted);font-size:1.05rem}
.prod .btn{margin-top:8px;padding:10px 18px}

/* owner */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs button{border:1px solid transparent;background:none;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.pubbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:15;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--hero-bg);color:var(--hero-fg);padding:12px 18px;border-radius:12px;margin-bottom:20px}
.pubbar .grow{flex:1}
.pubbar .btn{padding:8px 20px}
.pubbar .btn.ghost{color:var(--hero-fg);border-color:rgba(246,241,233,.4)}
.pubbar #o-publish{background:var(--hero-gold);border-color:var(--hero-gold);color:#241B3A}
.o-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.o-grid{grid-template-columns:1fr}}
.o-list{display:flex;flex-direction:column;gap:8px}
.o-item{display:flex;flex-direction:column;gap:4px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;width:100%}
.o-item[aria-current="true"]{border-color:var(--gold-text);box-shadow:0 0 0 1px var(--gold-text) inset}
.o-item .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.o-item small{color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-text)}
.pill{font-size:.76rem;padding:1px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.s-new{color:var(--gold-text);border-color:var(--gold-text)}
.pill.s-accepted,.pill.s-done,.pill.s-delivered{color:var(--ok);border-color:var(--ok)}
.pill.s-rejected{color:var(--err);border-color:var(--err)}
.pill.s-progress{color:var(--fg);border-color:var(--fg)}
.o-detail{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:22px;min-width:0}
.o-detail h2{font-size:1.9rem}
.o-detail h3{font-size:1.25rem;margin-bottom:8px}
.o-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.o-row .btn{padding:8px 18px;font-size:.92rem}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:transparent;border-color:var(--err);color:var(--err)}
.btn.no:hover{background:transparent;opacity:.8}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ck input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}
.ck.on span{text-decoration:line-through;color:var(--muted)}
.o-kv{display:grid;grid-template-columns:160px 1fr;gap:6px 16px;margin:0}
.o-kv dt{color:var(--muted)}.o-kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.o-kv{grid-template-columns:1fr}.o-kv dt{margin-top:8px}}
.o-box{border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.o-box textarea{min-height:80px}
.p-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.p-row{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.p-row img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface-2)}
.p-row .g{flex:1;min-width:0}
.p-row .g b{font-weight:500;display:block}
.p-row .g small{color:var(--muted)}
.p-form{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.p-photos{display:flex;gap:10px;flex-wrap:wrap}
.p-photos div{position:relative;width:96px;height:96px}
.p-photos img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.p-photos button{position:absolute;top:-6px;inset-inline-end:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--err);color:#fff;cursor:pointer;line-height:24px;padding:0}
.s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.s-grid{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.s-grid{grid-template-columns:1fr}}
.s-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.s-card img,.s-card .ph-tones{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.s-card .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.s-card .btn{padding:7px 14px;font-size:.88rem}
.pr-table{display:grid;grid-template-columns:1fr 140px;gap:8px 16px;align-items:center;max-width:560px}
.pr-table h3{grid-column:1/-1;margin:20px 0 4px}
.o-note{color:var(--muted);font-size:.92rem}

/* footer v2 */
footer{padding-bottom:28px}
footer .ft{align-items:flex-start}
footer .ft-contact ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;color:var(--muted)}

footer .ft-contact li>span{min-width:76px}
footer .ft-contact a{color:var(--fg)}

footer .ft-contact li{align-items:center}

.swatches{max-width:760px}

.modal-card h2{font-size:1.8rem}
.modal-x{position:absolute;top:10px;inset-inline-end:12px;border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted)}
#auth-form{display:flex;flex-direction:column;gap:14px}
#auth-form .btn{width:100%}
.auth-msg{min-height:1.2em;font-size:.9rem;color:var(--err)}

.linkbtn{border:0;background:none;color:var(--gold-text);cursor:pointer;text-decoration:underline;padding:4px;font-size:.92rem}

#res-save{border:1px solid var(--gold-text)}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media (max-width:900px){.stat-grid{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:2rem;font-weight:500;color:var(--gold-text);line-height:1.1}
.stat small{color:var(--muted)}
.ev-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}

const HEAD = "<title>JONALUX Furniture Studio<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\"><\/script>\n<script src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js\"><\/script>\n<script src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js\"><\/script>\n<script src=\"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js\"><\/script>";
const SKELETON = "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>";
let lang = 'ar';
try{ const s = localStorage.getItem('jl-lang'); if(s==='ar'||s==='en') lang = s; }catch(e){}
const tt = (ar,en) => lang==='ar' ? ar : en;
const tx = o => o[lang];
const num = n => lang==='ar' ? String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]) : String(n);
const unit = () => tt('ر.س','SAR');
const money = n => `${fmt(n)} <small class="u" ${T({ar:'ر.س',en:'SAR'})}>${unit()}</small>`;
const sameSet = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
const byId = (arr,id) => arr.find(x=>x.id===id);
const withLang = (l,fn) => { const old = lang; lang = l; try{ return fn(); } finally { lang = old; } };
const hooks = [];   // functions re-run when the language changes
const track = (t,x) => { try{ if(window.JL_track) window.JL_track(t,x); }catch(e){} };   // no-op unless the hosted (Firebase) build defines JL_track

/* ---------- site content saved inside the page (products, style photos, prices) ---------- */
let STATE;
try{ STATE = JSON.parse($('#site-data').textContent); }catch(e){ STATE = {}; }
STATE.products = STATE.products || []; STATE.styleImages = STATE.styleImages || {}; STATE.prices = STATE.prices || {svc:{},pkg:{},add:{}};
['svc','pkg','add'].forEach(k=>{ STATE.prices[k] = STATE.prices[k] || {}; });
const BASE = {svc:Object.fromEntries(SERVICES.map(x=>[x.id,x.price])), pkg:Object.fromEntries(PACKAGES.map(x=>[x.id,x.price])), add:Object.fromEntries(ADDONS.map(x=>[x.id,x.price]))};
(function applyPrices(){
  const p = STATE.prices;
  SERVICES.forEach(x=>{ if(Number.isFinite(p.svc[x.id])) x.price = p.svc[x.id]; });
  PACKAGES.forEach(x=>{ if(Number.isFinite(p.pkg[x.id])) x.price = p.pkg[x.id]; });
  ADDONS.forEach(x=>{ if(Number.isFinite(p.add[x.id])) x.price = p.add[x.id]; });
})();

/* ---------- publishing the page from inside itself (owner only) ---------- */
function buildDoc(state){
  const css = $('#css').textContent, tpl = $('#tpl').innerHTML, js = $('#main-js').textContent;
  const json = JSON.stringify(state).replace(/</g,'\\u003c').split(String.fromCharCode(8232)).join('\\u2028').split(String.fromCharCode(8233)).join('\\u2029');
  return SKELETON + '\n' + HEAD + '\n<style id="css">' + css + '</style>\n<template id="tpl">' + tpl + '</template>\n<script id="site-data" type="application/json">' + json + '<\/script>\n<script id="main-js">' + js + '<\/script>\n</body></html>';
}
async function publishDraft(draft){
  const a = await window.claude?.use?.('artifact');
  if(!a) throw {code:'unavailable'};
  const html = buildDoc(draft);
  if(html.length > 15*1024*1024) throw {code:'too_large'};
  return a.publish(html);
}

/* ---------- language ---------- */
function applyLang(){
  const d = document.documentElement; d.lang = lang; d.dir = lang==='ar' ? 'rtl' : 'ltr';
  $$('[data-ar]').forEach(el=>{ const v = el.getAttribute('data-'+lang); if(el.hasAttribute('data-h')) el.innerHTML = v; else el.textContent = v; });
  $$('[data-ph-ar]').forEach(el=>el.placeholder = el.getAttribute('data-ph-'+lang));
  $('#lang-btn').textContent = lang==='ar' ? 'EN' : 'عربي';
  $('#lang-btn').setAttribute('aria-label', lang==='ar' ? 'Switch to English' : 'التبديل إلى العربية');
  $$('.steps .n').forEach((e,i)=>e.textContent = num(i+1));
  const y = new Date().getFullYear();
  $('#copy').textContent = lang==='ar' ? `© ${num(y)} جونا لوكس. جميع الحقوق محفوظة.` : `© ${y} JONALUX. All rights reserved.`;
  hooks.forEach(h=>h());
}

/* ---------- router ---------- */
let isOwner = false;
const ROUTES = ['home','about','services','custom','ready','owner','account'];
let lastRoute = null;
function route(){
  let r = ROUTES.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
  if(r==='owner' && !isOwner) r = 'home';
  if(r==='account' && !window.JL_FB) r = 'home';
  if(r!==lastRoute){ lastRoute = r; track('page',r); }
  ROUTES.forEach(x=>{ $('#view-'+x).hidden = x!==r; });
  $$('#nav a').forEach(a=>{ a.getAttribute('data-route')===r ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

function calcEstimate(o){
  const sel = o.sel||[], n = o.pieces||1, lines = []; let design = 0, other = 0, from = false;
  const pk = PACKAGES.find(p=>sameSet(p.items,sel));
  const times = n>1 ? ` × ${n}` : '';
  if(sel.length){
    if(pk){ lines.push({l:{ar:pk.t.ar+times,en:pk.t.en+times}, a:pk.price*n}); design += pk.price*n; }
    else sel.forEach(id=>{ const s = byId(SERVICES,id); if(s){ lines.push({l:{ar:s.t.ar+times,en:s.t.en+times}, a:s.price*n}); design += s.price*n; } });
  }
  ADDONS.forEach(a=>{
    const v = o.addons?.[a.id];
    if(a.qty){ const q = v||0; if(q){ lines.push({l:{ar:`${a.t.ar} × ${q}`,en:`${a.t.en} × ${q}`}, a:a.price*q}); design += a.price*q; } }
    else if(v){ lines.push({l:{ar:a.t.ar+' (من)',en:a.t.en+' (from)'}, a:a.price}); other += a.price; from = true; }
  });
  let rush = 0;
  if(o.urgent && design>0){ rush = Math.round(design*STUDIO.rush); lines.push({l:{ar:'تسليم مستعجل +٢٥٪',en:'Expedited delivery +25%'}, a:rush}); }
  return {lines, total: design+other+rush, from};
}

/* order code: lets the studio paste the order into the owner dashboard */
function orderCode(o){ return 'JL1.' + btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
const INVIS = /[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff\u00a0]/g;
function parseCode(t){
  t = String(t||'').replace(INVIS,' '); const i = t.indexOf('JL1.'); if(i<0) return null;
  const rest = t.slice(i+4);
  const dec = s => { try{ let b = s.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b += '='; const o = JSON.parse(decodeURIComponent(escape(atob(b)))); return o && o.ref && o.name ? o : null; }catch(e){ return null; } };
  let m = /^[A-Za-z0-9_-]+/.exec(rest); if(m){ const o = dec(m[0]); if(o) return o; }
  m = /^[A-Za-z0-9_-]+/.exec(rest.replace(/\s+/g,'')); if(!m) return null;
  let s = m[0]; for(let k=0;k<80 && s.length>20;k++){ const o = dec(s); if(o) return o; s = s.slice(0,-1); }
  return null;
}
/* fallback: read a copied summary (Arabic or English) even when its order code is missing or damaged */
function parseSummary(text){
  const t = String(text||'').replace(INVIS,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\r/g,'');
  const lines = t.split('\n').map(x=>x.trim()).filter(Boolean), kv = {};
  lines.forEach(l=>{ if(l.startsWith('-')) return; const i = l.indexOf(':'); if(i>0){ const k = l.slice(0,i).trim().toLowerCase(); if(!(k in kv)) kv[k] = l.slice(i+1).trim(); } });
  const get = (...ks) => { for(const k of ks){ const v = kv[k.toLowerCase()]; if(v!==undefined) return v; } return ''; };
  const name = get('الاسم','Name'), phone = get('الواتساب','WhatsApp'), email = get('البريد الإلكتروني','Email');
  const low = x => String(x||'').toLowerCase(), has = (hay,o) => { hay = low(hay); return hay.includes(low(o.ar)) || hay.includes(low(o.en)); };
  const byName = (arr,v) => arr.find(x=>has(v,x.t));
  let sel = [], urgent = false, addons = {xrender:0,xrev:0,xshop:0,source:false}, pieces = parseInt(get('عدد القطع','Pieces'),10) || 1;
  let inSvc = false;
  lines.forEach(l=>{
    if(/^(الخدمات|Services)\s*:/i.test(l)){ inSvc = true; return; }
    if(!inSvc || !l.startsWith('-')) return;
    const L = l.replace(/^-\s*/,''), nm = L.includes(':') ? L.slice(0,L.lastIndexOf(':')) : L, q = /[×x]\s*(\d+)/.exec(nm);
    if(/مستعجل|expedited/i.test(nm)){ urgent = true; return; }
    const ad = ADDONS.find(a=>has(nm,a.t));
    if(ad){ if(ad.qty) addons[ad.id] = q ? +q[1] : 1; else addons[ad.id] = true; return; }
    const pk = PACKAGES.find(p=>has(nm,p.t));
    if(pk){ pk.items.forEach(id=>{ if(!sel.includes(id)) sel.push(id); }); if(q) pieces = +q[1]; return; }
    const sv = SERVICES.find(s=>has(nm,s.t)); if(sv){ if(!sel.includes(sv.id)) sel.push(sv.id); if(q) pieces = +q[1]; }
  });
  if(!sel.length){ SERVICES.forEach(s=>{ if(has(t,s.t) && !sel.includes(s.id)) sel.push(s.id); }); }   // last resort: any service name found in the text
  sel = SERVICES.map(s=>s.id).filter(id=>sel.includes(id));
  const pr = get('الأولوية','Priority'); if(pr && has(pr,PRIOS[1].t)) urgent = true;
  if(!name || !sel.length) return null;
  const ref = (/JL-\d{8}-\d{3}/.exec(t)||[])[0] || ('JL-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(100+Math.random()*900));
  const o = {ref, date:new Date().toISOString(), name, phone, email:email==='—'?'':email, sel, pieces:Math.max(1,Math.min(30,pieces)), addons, urgent, prio:urgent?'urgent':'flexible', cust:false, fromText:true};
  const furn = get('الأثاث المطلوب','Furniture');
  if(furn && furn!=='—'){
    o.cust = true; o.furn = furn;
    const dm = get('أبعاد المساحة','Space dimensions'), n3 = (dm.match(/\d+(?:\.\d+)?/g)||[]);
    if(n3.length>=3){ o.l = n3[0]; o.w = n3[1]; o.h = n3[2]; } else { o.l = o.w = o.h = ''; }
    o.unit = /(^|\s)(م|m)\s*$/i.test(dm) ? 'm' : 'cm';
    const sp = get('نوع المساحة','Type of space'), spo = byName(SPACES,sp); o.space = spo ? spo.id : 'other'; o.spaceOther = (/\(([^)]+)\)/.exec(sp)||[])[1] || '';
    const bd = get('الميزانية','Budget').replace(/,/g,''); o.budget = /\d/.test(bd) ? (bd.match(/\d+/)||[''])[0] : '';
    o.usage = (byName(USAGES,get('نسبة الاستخدام','Usage'))||USAGES[1]).id;
    o.style = (byName(STYLES,get('الستايل','Style'))||STYLES[STYLES.length-1]).id;
    const split = (arr,v) => { const ids = [], other = []; String(v||'').split(/[،,]/).map(x=>x.trim()).filter(x=>x&&x!=='—').forEach(x=>{ const m = arr.find(c=>low(c.t.ar)===low(x)||low(c.t.en)===low(x)); if(m) ids.push(m.id); else other.push(x); }); return [ids,other.join(', ')]; };
    [o.colors,o.colorOther] = split(COLORS,get('الألوان','Colours'));
    [o.mats,o.matOther] = split(MATERIALS,get('الخامات','Materials'));
    const nt = get('ملاحظات','Notes'); o.notes = nt==='—' ? '' : nt;
  }
  return o;
}

/* ---------- PDF (Arabic or English) ---------- */
async function makePdf(o,l){
  if(!window.jspdf || !window.html2canvas) throw new Error('pdf libs missing');
  try{ await document.fonts.ready; }catch(e){}
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff';
  host.innerHTML = `<div class="sheet" lang="${l}" dir="${l==='ar'?'rtl':'ltr'}">${sheetFor(o,l)}</div>`;
  document.body.appendChild(host);
  try{
    const pdf = new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight(); let y = 0;
    for(const b of $$('.blk',host)){
      const c = await window.html2canvas(b,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const h = c.height*PW/c.width;
      if(y>0 && y+h>PH){ pdf.addPage(); y = 0; }
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,y,PW,h); y += h;
    }
    return pdf.output('blob');

}

function compress(file,max=1000,q=0.82){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>{ const im = new Image(); im.onload = ()=>{ const k = Math.min(1,max/Math.max(im.width,im.height)); const c = document.createElement('canvas');
      c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
      im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function bindOrders(){

      const o = parseOrderText($('#o-paste').value);
      if(!o){ addMsg.textContent = tt('لم أستطع قراءة الطلب من النص. الصقي الملخص كاملاً كما نُسخ (الاسم والخدمات).','Could not read an order from this text. Paste the full summary as copied (name and services).'); return; }
      const r = await addOrder(o).catch(()=>false);
      addMsg.textContent = r==='exists' ? tt('هذا الطلب مضاف مسبقاً.','This order is already added.') : r ? tt(`تمت الإضافة (${num((o.sel||[]).length)} خدمات محددة تلقائياً).`,`Added (${(o.sel||[]).length} services detected automatically).`) : tt('تعذر الحفظ.','Could not save.');
      if(r===true) $('#o-paste').value = ''; return;
    }
    if(el.id==='o-manual-go'){
      const name = $('#m-name').value.trim(), phone = $('#m-phone').value.trim(), sel = $$('input[name=m-svc]:checked').map(i=>i.value);
      if(!name || !phone || !sel.length){ addMsg.textContent = tt('أدخلي الاسم والرقم وخدمة واحدة على الأقل.','Enter a name, a number and at least one service.'); return; }
      const d = new Date(), p2 = n=>String(n).padStart(2,'0');
      const o = {ref:`JL-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${Math.floor(100+Math.random()*900)}`, date:d.toISOString(), name, phone, email:'', sel, pieces:1, addons:{}, urgent:false, prio:'flexible', cust:false};
      const r = await addOrder(o,{notes:$('#m-notes').value.trim()}).catch(()=>false);
      addMsg.textContent = r===true ? tt('تمت الإضافة.','Added.') : tt('تعذر الحفظ.','Could not save.');
      if(r===true){ $('#m-name').value = $('#m-phone').value = $('#m-notes').value = ''; $$('input[name=m-svc]').forEach(i=>i.checked = false); } return;
    }
    const id = selId, r = orders.get(id), act = el.dataset.act;
    if(act==='select'){ selId = el.dataset.id; confirmDel = null; renderOrders(); return; }
    if(!r) return;
    if(act==='status'){ const v = el.dataset.v; upd(id,{status:v}); return; }
    if(act==='pdf'){
      msg(tt('نجهز الملف…','Preparing your PDF…'));
      try{ const blob = await makePdf(r.o,el.dataset.l); await savePdf(blob,`JONALUX-order-${r.ref}-${el.dataset.l}.pdf`); msg(''); }
      catch(e){ console.warn(e); msg(tt('تعذر إنشاء PDF هنا.','The PDF could not be created here.')); } return;
    }
    if(act==='copy'){ const ok = await copyText(summaryFor(r.o,el.dataset.l), $('#o-msg')); if(ok) msg(tt('تم النسخ.','Copied.')); return; }
    if(act==='del'){
      if(confirmDel!==id){ confirmDel = id; renderOrders(); return; }
      confirmDel = null; selId = null; ownerDb.doc('orders/'+id).delete().catch(()=>{}); return;
    }
  });
  pane.addEventListener('change',ev=>{
    const el = ev.target, r = orders.get(selId); if(!r) return;
    if(el.dataset.step) upd(selId,{steps:{[el.dataset.step]:el.checked}});
    else if(el.dataset.done) upd(selId,{done:{[el.dataset.done]:el.checked}});
    else if(el.dataset.act==='statusSel') upd(selId,{status:el.value});
    else if(el.dataset.act==='notes') upd(selId,{notes:el.value});
    else if(el.dataset.act==='reason') upd(selId,{reason:el.value});
  });
}

function renderStyles(){
  $('#o-styles').innerHTML = `<p class="o-note" style="margin-bottom:16px">${tt('ارفعي صورة واقعية لكل ستايل ليفهمه العميل. حتى ترفعيها تظهر ألوان الستايل فقط.','Upload a realistic photo for each style so clients understand it. Until you do, only the style’s colours are shown.')}</p>
    <div class="s-grid">${STYLES.map(s=>`<div class="s-card">${draft.styleImages[s.id]?`<img src="${esc(draft.styleImages[s.id])}" alt="">`:`<span class="ph-tones">${STYLE_TONES[s.id].map(c=>`<i style="background:${c}"></i>`).join('')}</span>`}
      <div class="tx"><b>${esc(tx(s.t))}</b><label class="btn ghost" style="cursor:pointer;text-align:center">${draft.styleImages[s.id]?tt('تغيير الصورة','Change photo'):tt('رفع صورة','Upload photo')}<input type="file" accept="image/*" data-style="${s.id}" hidden></label>
      ${draft.styleImages[s.id]?`<button type="button" class="btn no" data-style-rm="${s.id}">${tt('إزالة','Remove')}</button>`:''}</div></div>`).join('')}</div>`;
}
function bindStyles(){
  const pane = $('#o-styles');
  pane.addEventListener('change',async ev=>{
    const id = ev.target.dataset.style; if(!id || !ev.target.files[0]) return;
    try{ const img = await compress(ev.target.files[0],1000,0.78); await fdb.doc('styleImages/'+id).set({img}); }catch(e){ console.warn(e); }
  });
  pane.addEventListener('click',ev=>{ const id = ev.target.dataset.styleRm; if(id){ fdb.doc('styleImages/'+id).delete().catch(()=>{}); } });
}

/* ================= PRICES ================= */
function renderPrices(){
  const grp = (k,arr,title) => `<h3>${title}</h3>${arr.map(x=>`<span>${esc(tx(x.t))}</span><input type="number" min="0" step="10" data-pk="${k}" data-id="${x.id}" value="${draft.prices[k][x.id]??BASE[k][x.id]}">`).join('')}`;
  $('#o-prices').innerHTML = `<p class="o-note" style="margin-bottom:12px">${tt('الأسعار بالريال لكل قطعة، وتُحفظ تلقائياً وتظهر في الموقع.','Prices in SAR per piece. They save automatically and show on the site.')}</p>
    <div class="pr-table">${grp('svc',SERVICES,tt('الخدمات','Services'))}${grp('pkg',PACKAGES,tt('الباقات','Packages'))}${grp('add',ADDONS,tt('الخدمات الإضافية','Additional services'))}</div>`;
}
function bindPrices(){
  $('#o-prices').addEventListener('input',ev=>{
    const el = ev.target, k = el.dataset.pk; if(!k) return;
    const v = parseFloat(el.value);
    if(Number.isFinite(v) && v>=0 && v!==BASE[k][el.dataset.id]) PRICES[k][el.dataset.id] = v; else delete PRICES[k][el.dataset.id];
    clearTimeout(priceTimer); priceTimer = setTimeout(savePrices,700);
  });
}

function renderOwner(){
  if(!ownerReady) return;
  renderProducts(); renderStyles(); renderPrices(); renderOrders(); if(tab==='activity') renderActivity();
}
hooks.push(()=>{ if(ownerReady){ const keep = $('#o-paste')?.value; renderOrdersShell(); if($('#o-paste')) $('#o-paste').value = keep||''; renderOwner(); showTab(tab); } });


/* ================= hosted build: saving, live data, activity ================= */
let priceTimer = null, events = [], pendingRender = false;
function savePrices(){
  const p = {svc:{...PRICES.svc}, pkg:{...PRICES.pkg}, add:{...PRICES.add}};
  applyPricesFrom(p);
  fdb.doc('settings/prices').set(p).catch(e=>console.warn('prices',e));
  if(!formTouched && $('#result').hidden){ renderStatic(); applyLang(); } else renderSummary();
}
function prodTooBig(p){ return JSON.stringify(p).length > 900000 ? tt('حجم الصور كبير. احذفي صورة أو ارفعي صوراً أصغر.','The photos are too large. Remove one or upload smaller photos.') : ''; }
const fbSaveProduct = p => fdb.doc('products/'+p.id).set({...p, ts:p.ts||Date.now()});
const fbDeleteProduct = id => fdb.doc('products/'+id).delete().catch(e=>console.warn(e));

function makeOwnerDb(){
  const split = d => { d = {...d}; let n; if('notes' in d){ n = d.notes; delete d.notes; } return [d,n]; };
  return { doc: path => { const id = path.split('/')[1]; return {
    set: async d => { const [x,n] = split(d); await fdb.doc(path).set(x); if(n!==undefined) await fdb.doc('ownerNotes/'+id).set({text:n}); },
    update: async d => { const [x,n] = split(d); if(Object.keys(x).length) await fdb.doc(path).set(x,{merge:true}); if(n!==undefined) await fdb.doc('ownerNotes/'+id).set({text:n}); },
    delete: async () => { await fdb.doc(path).delete(); fdb.doc('ownerNotes/'+id).delete().catch(()=>{}); } }; } };
}
function rebuildOrders(){
  orders = new Map(rawOrders.map(r=>[r.id,{...r, notes: notesMap.has(r.id) ? notesMap.get(r.id) : (r.notes||'')}]));
  if($('#o-detail') && $('#o-detail').contains(document.activeElement)){ pendingRender = true; return; }
  renderOrders();
}
document.addEventListener('focusout',()=>{ if(pendingRender){ setTimeout(()=>{ if(!($('#o-detail') && $('#o-detail').contains(document.activeElement))){ pendingRender = false; renderOrders(); } },50); } });
function ownerContentChanged(){
  if(!ownerReady) return;
  if(!editing) renderProducts();
  renderStyles();
  if(!$('#o-prices').contains(document.activeElement)) renderPrices();
}
function ownerEnable(){
  ownerDb = makeOwnerDb(); ownerReady = true; ordersState = 'loading';
  $('#nav-owner').hidden = false; $('#tab-activity').hidden = false;
  if(!ownerBound){ renderOrdersShell(); bindOrders(); bindProducts(); bindStyles(); bindPrices(); ownerBound = true; } else renderOrdersShell();
  showTab('orders'); renderOwner();
  const t = setTimeout(()=>{ if(ordersState==='loading'){ ordersState = 'error'; renderOrders(); } },12000);
  ownerUnsubs.push(fdb.collection('orders').onSnapshot(snap=>{ clearTimeout(t); ordersState = 'ready'; rawOrders = snap.docs.map(d=>({id:d.id,...d.data()})); rebuildOrders(); }, e=>{ clearTimeout(t); console.warn('orders',e); ordersState = 'error'; renderOrders(); }));
  ownerUnsubs.push(fdb.collection('ownerNotes').onSnapshot(snap=>{ notesMap = new Map(snap.docs.map(d=>[d.id,d.data().text||''])); rebuildOrders(); }, e=>console.warn('notes',e)));
  ownerUnsubs.push(fdb.collection('events').orderBy('t','desc').limit(1000).onSnapshot(snap=>{ events = snap.docs.map(d=>d.data()); if(tab==='activity') renderActivity(); }, e=>console.warn('events',e)));
}
function ownerDisable(){
  ownerUnsubs.splice(0).forEach(u=>{ try{ u(); }catch(e){} });
  ownerReady = false; ownerDb = null; orders = new Map(); rawOrders = []; events = [];
  $('#nav-owner').hidden = true; $('#tab-activity').hidden = true;
}

/* --- activity of visitors and clients --- */
const EV_LABEL = {visit:['زيارة جديدة','New visit'], page:['تصفح صفحة','Viewed a page'], lang:['غيّر اللغة','Changed language'], order_start:['بدأ تعبئة طلب','Started an order'], order_submit:['أنشأ ملف طلب','Created an order'],
  whatsapp_order:['ضغط «إرسال على الواتساب»','Tapped “Send on WhatsApp”'], pdf:['نزّل PDF','Downloaded a PDF'], copy_summary:['نسخ الملخص','Copied the summary'], product_ask:['سأل عن قطعة جاهزة','Asked about a ready piece'],
  contact_click:['ضغط رابط تواصل','Tapped a contact link'], signup:['أنشأ حساباً','Created an account'], login:['سجّل دخوله','Signed in']};
const PAGE_LABEL = {home:['الرئيسية','Home'], about:['من نحن','About us'], services:['الخدمات','Services'], custom:['تخصيص الأثاث','Furniture customisation'], ready:['أثاث جاهز','Ready furniture'], account:['طلباتي','My orders']};
const evMs = e => (e.t && e.t.toMillis) ? e.t.toMillis() : Date.now();
function renderActivity(){
  const box = $('#o-activity'); if(!box) return;
  const now = Date.now(), d = new Date(); d.setHours(0,0,0,0); const d0 = d.getTime(), d7 = now - 7*864e5;
  const cnt = (type,since) => events.filter(e=>e.type===type && evMs(e)>=since).length;
  const cards = [[cnt('visit',d0),tt('زيارات اليوم','Visits today')],[cnt('visit',d7),tt('زيارات آخر ٧ أيام','Visits, last 7 days')],[cnt('order_start',d7),tt('بدأوا طلباً','Started an order')],[cnt('order_submit',d7),tt('أنشأوا ملف طلب','Created an order')],
    [cnt('whatsapp_order',d7),tt('ضغطوا إرسال بالواتساب','Tapped Send on WhatsApp')],[cnt('signup',d7),tt('حسابات جديدة','New accounts')],[cnt('product_ask',d7),tt('استفسروا عن قطع جاهزة','Asked about ready pieces')],[cnt('pdf',d7)+cnt('copy_summary',d7),tt('PDF ونسخ الملخص','PDFs and copies')]];
  const pages = {}; events.filter(e=>e.type==='page' && evMs(e)>=d7).forEach(e=>{ pages[e.item] = (pages[e.item]||0)+1; });
  const top = Object.entries(pages).sort((a,b)=>b[1]-a[1]);
  const tm = ms => new Date(ms).toLocaleString(lang==='ar'?'ar-SA-u-ca-gregory-nu-latn':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const lbl = e => { const l = EV_LABEL[e.type]; return l ? tt(l[0],l[1]) : e.type; };
  const itemText = e => e.type==='page' ? ((PAGE_LABEL[e.item]||[e.item,e.item])[lang==='ar'?0:1]) : (e.type==='whatsapp_order'||e.type==='order_submit') ? e.item : e.item;
  box.innerHTML = `<p class="o-note" style="margin-bottom:14px">${tt('هنا تفاعلات الزوار والعملاء في الموقع. زياراتك أنتِ لا تُحسب. الأرقام من آخر ١٠٠٠ حدث.','Here is what visitors and clients do on the site. Your own visits are not counted. Figures come from the last 1,000 events.')}</p>
    <div class="stat-grid">${cards.map(c=>`<div class="stat"><b>${num(c[0])}</b><small>${esc(c[1])}</small></div>`).join('')}</div>
    <h3 style="margin-bottom:8px">${tt('أكثر الصفحات تصفحاً (٧ أيام)','Most viewed pages (7 days)')}</h3>
    ${top.length?`<div class="chips" style="margin-bottom:22px">${top.map(([k,v])=>`<span class="chip">${esc((PAGE_LABEL[k]||[k,k])[lang==='ar'?0:1])} · ${num(v)}</span>`).join('')}</div>`:`<p class="o-note" style="margin-bottom:22px">—</p>`}
    <h3 style="margin-bottom:8px">${tt('آخر التفاعلات','Latest activity')}</h3>
    ${events.length?`<div class="ev-list">${events.slice(0,80).map(e=>`<div class="ev"><small>${esc(tm(evMs(e)))}</small><span>${esc(lbl(e))}</span><span>${esc(itemText(e)||'')}</span><small>${e.who?esc(e.who):tt('زائر','Visitor')}</small></div>`).join('')}</div>`:`<p class="o-note">${tt('لا توجد تفاعلات بعد.','No activity yet.')}</p>`}`;
}

/* ---------- boot (hosted build) ---------- */
$('#lang-btn').addEventListener('click',()=>{ lang = lang==='ar'?'en':'ar'; try{localStorage.setItem('jl-lang',lang)}catch(e){} applyLang(); track('lang',lang); });
renderStatic(); applyLang(); route(); initFirebase();
</script>
